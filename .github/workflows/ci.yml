name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verificar archivos y sintaxis JavaScript
        run: npm test

      - name: Crear artefacto del proyecto
        run: |
          cd src/public
          zip -r ../../patitas-potosinas.zip .

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: patitas-potosinas
          path: patitas-potosinas.zip
